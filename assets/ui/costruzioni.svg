<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="96" height="96" fill="none">
  <!-- Martello e chiave inglese incrociati: il pulsante che apre le costruzioni.
       Tratti grossi e pochi: a 30 pixel di lato i dettagli non si vedrebbero. -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- chiave inglese: manico in basso a sinistra, testa aperta in alto a destra -->
    <path d="M8 33 L23.5 17.5" stroke-width="5"/>
    <path d="M29.6 7.9 A6 6 0 1 0 33.1 11.5" stroke-width="5"/>
    <!-- martello: manico in basso a destra, testa in alto a sinistra -->
    <path d="M33 33 L18 18" stroke-width="5"/>
    <path d="M13.5 20.5 L20.5 13.5" stroke-width="8.5"/>
  </g>
</svg>
