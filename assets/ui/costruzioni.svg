<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="96" height="96" fill="none">
  <!-- Una casa: il pulsante che apre il negozio delle costruzioni.
       Martello e chiave inglese incrociati, a 28 pixel di lato, diventavano una
       macchia sola: due utensili sovrapposti sono troppa roba per un'icona
       piccola. Una casa e' la cosa che il negozio vende, si legge di colpo, e
       non somiglia al grafico a barre del pulsante dei conti qui accanto. -->
  <g stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- il tetto, da grondaia a grondaia -->
    <path d="M5.5 19.5 L20 7.5 L34.5 19.5"/>
    <!-- i muri: partono da sotto la falda e scendono a terra -->
    <path d="M9.5 18.5 V33 H30.5 V18.5"/>
  </g>
  <!-- la porta, piena: due righe sottili a questa misura si chiuderebbero -->
  <rect x="16.6" y="24" width="6.8" height="9" rx="1.2" fill="#ffffff"/>
</svg>
